services:
  - type: web
    name: droitgpt-indexer
    env: node
    plan: starter
    buildCommand: npm install --legacy-peer-deps
    startCommand: node query.js
    rootDir: indexer
    autoDeploy: true
    branch: main
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: ACCESS_TOKEN_TTL
        value: "7d"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: "https://droitgpt-ui.vercel.app"
      - key: ALLOWED_ORIGINS
        value: "https://droitgpt-ui.vercel.app,https://www.droitgpt.com,https://droitgpt.com"

  - type: web
    name: droitgpt-pdf-api
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    rootDir: pdf-service
    autoDeploy: true
    branch: main
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: businessplan-v9yy
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    rootDir: bp
    autoDeploy: true
    branch: main
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GENERATION_QUEUE_NAME
        value: "droitgpt-generation"
      - key: GENERATION_QUEUE_WORKER_ENABLED
        value: "true"
      - key: GENERATION_CONCURRENCY
        value: "2"
      - key: GENERATION_QUEUE_MAX_PENDING
        value: "100"
      - key: GENERATION_USER_LOCK_TTL_MS
        value: "21600000"
      - key: GENERATION_JOB_LOCK_DURATION_MS
        value: "300000"
      - key: GENERATION_STALLED_INTERVAL_MS
        value: "60000"
      - key: GENERATION_MAX_STALLED_COUNT
        value: "1"
      - key: GENERATION_QUEUE_RETENTION_SECONDS
        value: "604800"
      - key: GENERATION_QUEUE_RETENTION_COUNT
        value: "3000"
      - key: FLEXPAY_ENABLED
        value: "true"
      - key: FLEXPAY_PAYMENT_REQUIRED
        value: "true"
      - key: FLEXPAY_TOKEN
        sync: false
      - key: FLEXPAY_MERCHANT
        sync: false
      - key: FLEXPAY_MOBILE_URL
        value: "https://backend.flexpay.cd/api/rest/v1/paymentService"
      - key: FLEXPAY_CHECK_URL
        value: "https://apicheck.flexpaie.com/api/rest/v1/check"
      - key: FLEXPAY_CALLBACK_URL
        value: "https://businessplan-v9yy.onrender.com/payments/flexpay/callback"
      - key: FLEXPAY_CURRENCY
        value: "USD"
      - key: PAYMENT_DEFAULT_PRICE_USD
        value: "3"
      - key: PAYMENT_PRICE_BUSINESSPLAN_USD
        value: "3"
      - key: PAYMENT_PRICE_MEMOIRE_USD
        value: "3"
      - key: PAYMENT_PRICE_NGO_PROJECT_USD
        value: "3"
      - key: PAYMENT_PRICE_GRANTS_MANAGEMENT_USD
        value: "3"
      - key: PAYMENT_PRICE_EXCEL_APP_USD
        value: "3"
      - key: PAYMENT_PRICE_BUSINESSPLAN_PACK_USD
        value: "20"
      - key: QDRANT_PAYMENTS_COLLECTION
        value: "droitgpt_payments"
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: DOCUMENTS_SUPPORT_SECRET
        sync: false
      - key: QDRANT_GENERATED_DOCUMENTS_COLLECTION
        value: "droitgpt_generated_documents"
      - key: QDRANT_GENERATION_JOBS_COLLECTION
        value: "droitgpt_generation_jobs"
      - key: QDRANT_GRANTS_COLLECTION
        value: "grants_opportunities"
      - key: EXA_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PAYMENT_ALLOW_RECOVERY_ON_MISSING_JOB
        value: "true"
      - key: BP_JOB_TTL_MS
        value: "2592000000"
      - key: MEMOIRE_JOB_TTL_MS
        value: "2592000000"
      - key: NGO_JOB_TTL_MS
        value: "2592000000"
      - key: GRANTS_JOB_TTL_MS
        value: "2592000000"
      - key: EXCEL_JOB_TTL_MS
        value: "2592000000"
      - key: GRANTS_AUTO_PATROL_ENABLED
        value: "true"
      - key: GRANTS_PATROL_INTERVAL_MINUTES
        value: "360"
      - key: GRANTS_PATROL_WEB_SEARCH_ENABLED
        value: "true"
