<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DroitGPT Grants</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #657282;
        --line: #dfe4ea;
        --brand: #1967d2;
        --good: #137333;
        --warn: #b06000;
        --bad: #b3261e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        background: #12233a;
        color: white;
        padding: 18px 24px;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0;
      }
      header p {
        margin: 6px 0 0;
        color: #c8d3df;
        font-size: 13px;
      }
      main {
        display: grid;
        grid-template-columns: 330px 1fr;
        gap: 16px;
        padding: 16px;
      }
      aside, section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      aside {
        padding: 14px;
        align-self: start;
        position: sticky;
        top: 12px;
      }
      .content {
        min-width: 0;
      }
      .toolbar {
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr 150px 150px 120px;
        gap: 10px;
        align-items: end;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      input, select, textarea, button {
        width: 100%;
        font: inherit;
      }
      input, select, textarea {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 9px 10px;
        background: white;
        color: var(--text);
      }
      textarea {
        resize: vertical;
        min-height: 72px;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        background: var(--brand);
        color: white;
        cursor: pointer;
      }
      button.secondary {
        background: #e9eef6;
        color: #17324d;
      }
      button.ghost {
        background: transparent;
        color: var(--brand);
        border: 1px solid var(--line);
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      .stack {
        display: grid;
        gap: 10px;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .tabs button.active {
        background: #12233a;
        color: white;
      }
      .panel[hidden] {
        display: none;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .statusline {
        color: var(--muted);
        font-size: 13px;
        padding: 0 12px 12px;
      }
      .cards {
        display: grid;
        gap: 10px;
        padding: 12px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }
      .card h2 {
        margin: 0 0 7px;
        font-size: 16px;
        line-height: 1.3;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        color: #344255;
        background: #f9fafb;
      }
      .score {
        color: var(--good);
        font-weight: 700;
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(90px, 1fr));
        gap: 8px;
        align-items: center;
      }
      .detail {
        grid-column: 1 / -1;
        background: #f9fbfd;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        color: #283747;
        font-size: 13px;
        line-height: 1.45;
      }
      .detail h3 {
        margin: 10px 0 5px;
        font-size: 13px;
      }
      .muted { color: var(--muted); }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; }
        aside { position: static; }
        .toolbar { grid-template-columns: 1fr; }
        .card { grid-template-columns: 1fr; }
        .actions { grid-template-columns: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DroitGPT Grants Management</h1>
      <p>Recherche, veille, enrichissement et suivi des appels a projets.</p>
    </header>
    <main>
      <aside>
        <div class="tabs">
          <button id="searchTab" class="secondary active">Recherche</button>
          <button id="profileTab" class="secondary">Profil</button>
        </div>
        <div id="searchPanel" class="panel">
        <div class="stack">
          <div>
            <label for="keywords">Mots-cles</label>
            <input id="keywords" value="education grant africa" />
          </div>
          <div class="row">
            <div>
              <label for="country">Pays</label>
              <input id="country" value="RDC" />
            </div>
            <div>
              <label for="sector">Secteur</label>
              <input id="sector" value="education" />
            </div>
          </div>
          <div>
            <label for="sources">Sources</label>
            <input id="sources" value="grants.gov,undp,opportunities-for-youth,vc4a,scholarshipset,eu,worldbank,ungm,linkedin,foundations,embassies" />
          </div>
          <button id="discoverBtn">Rechercher et sauvegarder</button>
          <button id="watchBtn" class="secondary">Creer une veille 24h</button>
          <button id="runWatchBtn" class="ghost">Executer les veilles dues</button>
          <div>
            <label for="customSite">Site public additionnel</label>
            <input id="customSite" placeholder="https://example.org/search?q={q}" />
          </div>
          <div class="row">
            <div>
              <label for="intervalValue">Intervalle</label>
              <input id="intervalValue" type="number" min="1" value="24" />
            </div>
            <div>
              <label for="intervalUnit">Unite</label>
              <select id="intervalUnit">
                <option value="hours">Heures</option>
                <option value="days">Jours</option>
              </select>
            </div>
          </div>
          <div>
            <label for="emailTo">Email d'alerte</label>
            <input id="emailTo" type="email" placeholder="contact@organisation.org" />
          </div>
          <label style="display:flex;gap:8px;align-items:center;margin:0;color:#17202a;">
            <input id="emailAlerts" type="checkbox" style="width:auto;" checked />
            Activer les alertes email
          </label>
        </div>
        </div>
        <div id="profilePanel" class="panel" hidden>
          <div class="stack">
            <div><label>Nom</label><input id="profile_name" /></div>
            <div class="row">
              <div><label>Statut legal</label><input id="profile_legalStatus" /></div>
              <div><label>Pays</label><input id="profile_country" /></div>
            </div>
            <div><label>Email contact</label><input id="profile_contactEmail" /></div>
            <div><label>Mission</label><textarea id="profile_mission"></textarea></div>
            <div><label>Secteurs</label><input id="profile_sectors" /></div>
            <div><label>Groupes cibles</label><textarea id="profile_targetGroups"></textarea></div>
            <div><label>Projets passes / references</label><textarea id="profile_pastProjects"></textarea></div>
            <div><label>Equipe</label><textarea id="profile_team"></textarea></div>
            <div><label>Partenaires</label><textarea id="profile_partners"></textarea></div>
            <div><label>Suivi-evaluation / impact</label><textarea id="profile_monitoringEvaluation"></textarea></div>
            <button id="saveProfileBtn">Sauvegarder le profil</button>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="toolbar">
          <div>
            <label for="filterQ">Filtrer</label>
            <input id="filterQ" placeholder="titre, bailleur, secteur..." />
          </div>
          <div>
            <label for="filterStatus">Statut</label>
            <select id="filterStatus">
              <option value="">Tous</option>
              <option value="a_analyser">A analyser</option>
              <option value="candidat">Candidat</option>
              <option value="rejete">Rejete</option>
              <option value="soumis">Soumis</option>
              <option value="archive">Archive</option>
            </select>
          </div>
          <div>
            <label for="filterSource">Source</label>
            <input id="filterSource" placeholder="grants.gov" />
          </div>
          <button id="refreshBtn">Rafraichir</button>
        </div>
        <div class="statusline" id="statusline">Pret.</div>
        <div class="cards" id="cards"></div>
      </section>
    </main>

    <script>
      const api = "/generate-grants-management";
      const cards = document.getElementById("cards");
      const statusline = document.getElementById("statusline");

      function setBusy(message) {
        statusline.textContent = message;
      }

      function payload() {
        const custom = document.getElementById("customSite").value.trim();
        return {
          keywords: document.getElementById("keywords").value.trim(),
          country: document.getElementById("country").value.trim(),
          sector: document.getElementById("sector").value.trim(),
          organizationType: "ONG",
          limit: 30,
          sources: document.getElementById("sources").value.split(",").map((x) => x.trim()).filter(Boolean),
          customSites: custom ? [{ name: "Custom", url: custom }] : [],
          save: true
        };
      }

      async function request(url, options) {
        const res = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.details || json.error || "Erreur API");
        return json;
      }

      async function discover() {
        setBusy("Recherche multi-sources en cours...");
        const json = await request(`${api}/discover`, {
          method: "POST",
          body: JSON.stringify(payload())
        });
        setBusy(`${json.total || 0} resultats trouves. Sauvegarde: ${json.db?.inserted || 0} nouveaux, ${json.db?.updated || 0} mis a jour.`);
        await load();
      }

      async function createWatch() {
        setBusy("Creation de la veille...");
        const intervalValue = Math.max(1, Number(document.getElementById("intervalValue").value || 24));
        const intervalUnit = document.getElementById("intervalUnit").value;
        const intervalHours = intervalUnit === "days" ? intervalValue * 24 : intervalValue;
        const emailEnabled = document.getElementById("emailAlerts").checked;
        const emailTo = document.getElementById("emailTo").value.trim();
        const json = await request(`${api}/watch`, {
          method: "POST",
          body: JSON.stringify({
            name: `Veille ${document.getElementById("sector").value || "grants"}`,
            intervalHours,
            query: payload(),
            alerts: { email: emailEnabled, emailTo, slack: false, whatsapp: false }
          })
        });
        setBusy(`Veille creee: ${json.watch.name}. Prochaine execution: ${json.watch.nextRunAt}`);
      }

      async function runWatches() {
        setBusy("Execution des veilles...");
        const json = await request(`${api}/watch/run`, {
          method: "POST",
          body: JSON.stringify({ force: true })
        });
        setBusy(`Veilles executees: ${json.result?.due || 0}.`);
        await load();
      }

      async function load() {
        const params = new URLSearchParams();
        const q = document.getElementById("filterQ").value.trim();
        const userStatus = document.getElementById("filterStatus").value;
        const source = document.getElementById("filterSource").value.trim();
        if (q) params.set("q", q);
        if (userStatus) params.set("userStatus", userStatus);
        if (source) params.set("source", source);
        params.set("limit", "100");
        const json = await request(`${api}/opportunities?${params.toString()}`);
        render(json.rows || []);
        setBusy(`${json.total || 0} opportunites affichees sur ${json.dbTotal || 0}.`);
      }

      function render(rows) {
        cards.innerHTML = "";
        if (!rows.length) {
          cards.innerHTML = `<p class="muted">Aucune opportunite. Lance une recherche pour alimenter la base.</p>`;
          return;
        }
        for (const opp of rows) {
          const card = document.createElement("article");
          card.className = "card";
          const score = opp.match?.score ?? 0;
          const fav = opp.user?.favorite ? "★" : "☆";
          card.innerHTML = `
            <div>
              <h2>${escapeHtml(opp.title)}</h2>
              <div class="meta">
                <span class="pill">${escapeHtml(opp.source || "-")}</span>
                <span class="pill">${escapeHtml(opp.donor || "-")}</span>
                <span class="pill">${escapeHtml(opp.closeDate || opp.enrichment?.deadline || "deadline inconnue")}</span>
                <span class="pill score">${score}/100</span>
                <span class="pill">${escapeHtml(opp.language || opp.enrichment?.language || "langue ?")}</span>
              </div>
              <p class="muted">${escapeHtml((opp.description || opp.enrichment?.summaryText || "").slice(0, 260))}</p>
              <a href="${escapeAttr(opp.url)}" target="_blank" rel="noreferrer">Ouvrir la source</a>
            </div>
            <div class="actions">
              <button class="ghost" data-action="fav">${fav}</button>
              <select data-action="status">
                ${["a_analyser","candidat","rejete","soumis","archive"].map((s) => `<option value="${s}" ${opp.user?.status === s ? "selected" : ""}>${s}</option>`).join("")}
              </select>
              <button class="secondary" data-action="enrich">Enrichir</button>
              <button class="ghost" data-action="autofill">Remplir IA</button>
              <button class="ghost" data-action="detail">Detail</button>
            </div>
          `;
          const detail = document.createElement("div");
          detail.className = "detail";
          detail.hidden = true;
          detail.innerHTML = detailHtml(opp);
          card.appendChild(detail);
          card.querySelector('[data-action="fav"]').onclick = async () => {
            await patchOpp(opp.id, { favorite: !opp.user?.favorite });
          };
          card.querySelector('[data-action="status"]').onchange = async (e) => {
            await patchOpp(opp.id, { status: e.target.value });
          };
          card.querySelector('[data-action="enrich"]').onclick = async () => {
            setBusy("Enrichissement de la page detail...");
            await request(`${api}/opportunities/${encodeURIComponent(opp.id)}/enrich`, { method: "POST", body: "{}" });
            await load();
          };
          card.querySelector('[data-action="autofill"]').onclick = async () => {
            const manual = prompt("Colle les questions du formulaire (une question par ligne). Laisse vide pour utiliser les questions extraites.");
            const questions = manual && manual.trim() ? manual.split(/\\n+/).filter(Boolean) : (opp.enrichment?.formQuestions || []);
            if (!questions.length) {
              setBusy("Aucune question disponible. Enrichis la page ou colle les questions du formulaire.");
              return;
            }
            setBusy("Generation des reponses IA...");
            const json = await request(`${api}/opportunities/${encodeURIComponent(opp.id)}/autofill`, {
              method: "POST",
              body: JSON.stringify({ questions })
            });
            detail.hidden = false;
            detail.innerHTML = answersHtml(json.result, opp);
            setBusy(`Brouillon genere: ${json.result.answers.length} reponses.`);
          };
          card.querySelector('[data-action="detail"]').onclick = () => {
            detail.hidden = !detail.hidden;
          };
          cards.appendChild(card);
        }
      }

      function answersHtml(result, opp) {
        const answers = result.answers || [];
        const blocks = answers.map((a) => `
          <h3>${escapeHtml(a.question)}</h3>
          <p>${escapeHtml(a.answer)}</p>
          <div class="muted">Confiance: ${escapeHtml(a.confidence)} ${a.needsUserReview ? " - revue requise" : ""}</div>
        `).join("");
        const missing = (result.missingProfileFields || []).map((x) => `<li>${escapeHtml(x)}</li>`).join("");
        return `
          <h3>Reponses generees pour ${escapeHtml(opp.title)}</h3>
          ${blocks}
          <h3>Informations manquantes</h3>
          <ul>${missing || "<li>-</li>"}</ul>
        `;
      }

      const profileFields = ["name","legalStatus","country","contactEmail","mission","sectors","targetGroups","pastProjects","team","partners","monitoringEvaluation"];

      async function loadProfile() {
        const json = await request(`${api}/profile`);
        const p = json.profile || {};
        for (const key of profileFields) {
          const el = document.getElementById(`profile_${key}`);
          if (el) el.value = p[key] || "";
        }
      }

      async function saveProfile() {
        const profile = {};
        for (const key of profileFields) {
          const el = document.getElementById(`profile_${key}`);
          if (el) profile[key] = el.value;
        }
        await request(`${api}/profile`, {
          method: "PUT",
          body: JSON.stringify(profile)
        });
        setBusy("Profil entreprise sauvegarde.");
      }

      function switchTab(tab) {
        const isProfile = tab === "profile";
        document.getElementById("searchPanel").hidden = isProfile;
        document.getElementById("profilePanel").hidden = !isProfile;
        document.getElementById("searchTab").classList.toggle("active", !isProfile);
        document.getElementById("profileTab").classList.toggle("active", isProfile);
        if (isProfile) loadProfile().catch((e) => setBusy(e.message));
      }

      function detailHtml(opp) {
        const e = opp.enrichment || {};
        const questions = (e.formQuestions || []).map((q) => `<li>${escapeHtml(q)}</li>`).join("");
        return `
          <h3>Enrichissement</h3>
          <div>Budget: ${escapeHtml(e.budget || "-")}</div>
          <div>Pays detectes: ${escapeHtml((e.countries || []).join(", ") || "-")}</div>
          <div>Emails: ${escapeHtml((e.contactEmails || []).join(", ") || "-")}</div>
          <h3>Eligibilite</h3>
          <p>${escapeHtml(e.eligibility || opp.eligibility || "-")}</p>
          <h3>Questions de formulaire detectees</h3>
          <ul>${questions || "<li>-</li>"}</ul>
        `;
      }

      async function patchOpp(id, patch) {
        await request(`${api}/opportunities/${encodeURIComponent(id)}`, {
          method: "PATCH",
          body: JSON.stringify(patch)
        });
        await load();
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
      }
      function escapeAttr(value) {
        return escapeHtml(value).replace(/`/g, "&#96;");
      }

      document.getElementById("discoverBtn").onclick = () => discover().catch((e) => setBusy(e.message));
      document.getElementById("watchBtn").onclick = () => createWatch().catch((e) => setBusy(e.message));
      document.getElementById("runWatchBtn").onclick = () => runWatches().catch((e) => setBusy(e.message));
      document.getElementById("refreshBtn").onclick = () => load().catch((e) => setBusy(e.message));
      document.getElementById("saveProfileBtn").onclick = () => saveProfile().catch((e) => setBusy(e.message));
      document.getElementById("searchTab").onclick = () => switchTab("search");
      document.getElementById("profileTab").onclick = () => switchTab("profile");
      document.getElementById("filterQ").oninput = () => load().catch(() => {});
      document.getElementById("filterStatus").onchange = () => load().catch(() => {});
      document.getElementById("filterSource").oninput = () => load().catch(() => {});
      load().catch((e) => setBusy(e.message));
    </script>
  </body>
</html>
